data_source:
  # akshare_sina=纯新浪(上交所+深交所统一适配, 9 只宽基 ETF 全部实测通过)
  # tonghuashun=同花顺现货+新浪期权(仅上交所, 深市不支持)
  primary: akshare_sina
  underlying: "510500"
  scan_interval_seconds: 5
  request_timeout: 8
  max_retries: 3
  retry_backoff_seconds: 1.0
  max_batch: 40
  quote_stale_seconds: 30
  enable_greeks: true
