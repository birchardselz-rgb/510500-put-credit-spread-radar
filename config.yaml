contracts:
  expire_days_min: 15
  expire_days_max: 45
  expire_months_count: 3        # 扫描接下来 N 个到期月份(如 3=9月+10月+12月季度); 0=按上面天数窗口
  preferred_expire_month: null
  exclude_adjusted: true
account:
  capital: 500000
  max_risk_per_batch_pct: 0.02
  suggested_lots_cap: 100
strategy:
  min_credit_attractive: 0.085
  min_credit_good: 0.095
  min_credit_strong: 0.105
  min_safety_margin: 0.02
  min_reward_risk_ratio: 0.5
  sell_delta_min_abs: 0.15
  sell_delta_max_abs: 0.35
  max_leg_bid_ask_ratio: 0.5
  min_volume: 20
  min_open_interest: 100
  filter_illiquid: true
scoring:
  # 专业概率交易权重: POP(盈利概率)与EV(期望收益)占主导
  weights:
    pop: 0.25
    ev: 0.18
    credit: 0.18
    safety: 0.12
    reward_risk: 0.10
    liquidity: 0.06
    delta: 0.05
    volume_oi: 0.03
    iv: 0.03
  min_score_pass: 5.0
  score_observe_floor: 5.0
  score_good_floor: 7.0
  score_strong_floor: 9.0
  credit_anchor:
    a6: 0.085
    a8: 0.095
    a10: 0.105
  safety_anchor:
    a8: 0.02
    a10: 0.04
  rr_anchor:
    a8: 0.5
    a10: 0.8
  pop_anchor:
    a5: 0.60
    a8: 0.75
    a10: 0.88
  ev_anchor:
    a5: 0.0
    a8: 0.15
    a10: 0.30
  pop_min_hard: 0.60
  pop_min_soft: 0.70
  iv_good_min: 0.15
  iv_good_max: 0.45
alerts:
  confirm_required: 3
  cooldown_seconds: 300
  re_alert_score_delta: 0.5
  re_alert_credit_delta: 0.01
  min_credit_to_alert: 0.085
  min_score_to_alert: 7.0
  console_enabled: true
  sound_enabled: true
  webhook:
    enabled: false
    type: ''
    url: ''
    secret: ''
storage:
  database: data/scanner.db
  save_every_scan: true
logging:
  level: INFO
  file: logs/scanner.log
  max_bytes: 10485760
  backup_count: 5
mock:
  scenario: acceptance
  expiry_date: '2026-09-23'
  days_to_expiry: 27
